<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self'">
  <title>粘贴板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <input id="search" type="text" placeholder="搜索…">
      <div id="filter" class="tabs">
        <button data-f="all" class="active">全部</button>
        <button data-f="text">文本</button>
        <button data-f="image">图片</button>
        <button data-f="pinned">置顶</button>
        <button id="clear" title="清空历史">清空</button>
        <button id="theme" title="切换主题">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>
    <ul id="list"></ul>
    <footer>
      <span id="hint">↑↓ 选择 · ←→ 分类 · / 搜索 · Enter 粘贴 · Del 删除 · Esc 关闭</span>
    </footer>
  </div>
  <div id="toast"></div>
  <script src="renderer.js"></script>
</body>
</html>
