<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self'">
  <title>粘贴板</title>
  <link id="css-glass" rel="stylesheet" href="style.css">
  <link id="css-flat" rel="stylesheet" href="style-flat.css" disabled>
</head>
<body>
  <div id="app">
    <header>
      <input id="search" type="text" placeholder="搜索…">
      <div id="filter" class="tabs">
        <button data-f="all" class="active">全部</button>
        <button data-f="text">文本</button>
        <button data-f="image">图片</button>
        <button data-f="pinned">置顶</button>
        <button id="clear" title="清空历史">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14M10 11v6M14 11v6"/></svg>
        </button>
        <button id="style" title="切换风格">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
        </button>
        <button id="theme" title="切换主题">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>
    <ul id="list"></ul>
    <footer>
      <span id="hint">↑↓ 选择 · ←→ 分类 · / 搜索 · Enter 粘贴 · Del 删除 · Esc 关闭</span>
    </footer>
  </div>
  <div id="toast"></div>
  <script src="renderer.js"></script>
</body>
</html>
